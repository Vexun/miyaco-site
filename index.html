<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Miyako's Site</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			background: url("background.jpg") center / cover no-repeat fixed;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
		}

		.box {
			background: rgba(255, 255, 255, 0.55);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			padding: 2.5rem 4rem;
			border-radius: 1rem;
			text-align: center;
		}

		h1 {
			margin: 0;
			font-size: 2.5rem;
			color: #222;
		}

		p {
			margin: 0.75rem 0 0;
			color: #444;
		}
	</style>
</head>
<body>
	<div class="box">
		<h1>Miyako's Site</h1>
		<p>Work in progress &mdash; check back later.</p>
	</div>
</body>
</html>
