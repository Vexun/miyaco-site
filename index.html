<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Miyako's Site</title>
	<style>
		body::before {
			content: "";
			position: fixed;
			inset: -16px;
			background: url("background.jpg") center / cover no-repeat;
			filter: blur(14px);
			z-index: -1;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
		}

		.box {
			background: rgba(255, 255, 255, 0.55);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			padding: 2.5rem 4rem;
			border-radius: 1rem;
			text-align: center;
		}

		h1 {
			margin: 0;
			font-size: 2.5rem;
			color: #222;
		}

		p {
			margin: 0.75rem 0 0;
			color: #444;
		}

		.social-links {
			position: fixed;
			bottom: 2rem;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			justify-content: center;
			gap: 1.5rem;
		}

		.social-links a {
			color: #222;
			opacity: 0.7;
			transition: opacity 0.2s ease;
		}

		.social-links a:hover {
			opacity: 1;
		}
	</style>
</head>
<body>
	<div class="box">
		<h1>Miyako's Site</h1>
		<p>Work in progress &mdash; check back later.</p>
	</div>
	<nav class="social-links" aria-label="Social links"></nav>
	<script>
		const socialLinks = [
			{ label: "X.com", url: "https://x.com/" },
			{ label: "GitHub", url: "https://github.com/" }
		];

		const socialLinksContainer = document.querySelector(".social-links");
		socialLinks.forEach(({ label, url }) => {
			const link = document.createElement("a");
			link.href = url;
			link.target = "_blank";
			link.rel = "noopener noreferrer";
			link.textContent = label;
			socialLinksContainer.append(link);
		});
	</script>
</body>
</html>
