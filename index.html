<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Miyako's Site</title>
	<link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
	<style>
		body::before {
			content: "";
			position: fixed;
			inset: -16px;
			background: url("background.jpg") center / cover no-repeat;
			filter: blur(14px);
			z-index: -1;
		}

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			box-sizing: border-box;
			padding: 1.5rem;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
			-webkit-text-size-adjust: 100%;
		}

		.box {
			background: rgba(255, 255, 255, 0.55);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			padding: 2.5rem clamp(1.5rem, 8vw, 4rem);
			border-radius: 1rem;
			max-width: 100%;
			text-align: center;
		}

		h1 {
			margin: 0;
			font-size: clamp(1.75rem, 9vw, 2.5rem);
			color: #222;
			overflow-wrap: break-word;
		}

		p {
			margin: 0.75rem 0 0;
			color: #444;
		}

		.social-links {
			position: fixed;
			bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			justify-content: center;
			gap: 1.5rem;
		}

		.social-links a {
			color: #222;
			opacity: 0.7;
			display: inline-block;
			padding: 0.5rem 0.25rem;
			transition: opacity 0.2s ease;
		}

		.social-links a:hover {
			opacity: 1;
		}

		@media (max-height: 480px) {
			.box {
				padding: 1.25rem clamp(1.5rem, 6vw, 3rem);
			}

			h1 {
				font-size: 1.75rem;
			}

			.social-links {
				bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
			}
		}
	</style>
</head>
<body>
	<div class="box">
		<h1>Miyako's Site</h1>
		<p>Work in progress &mdash; check back later.</p>
	</div>
	<nav class="social-links" aria-label="Social links"></nav>
	<script>
		const socialLinks = [
			{ label: "X.com", url: "https://x.com/_Vexun" },
			{ label: "GitHub", url: "https://github.com/Vexun" }
		];

		const socialLinksContainer = document.querySelector(".social-links");
		socialLinks.forEach(({ label, url }) => {
			const link = document.createElement("a");
			link.href = url;
			link.target = "_blank";
			link.rel = "noopener noreferrer";
			link.textContent = label;
			socialLinksContainer.append(link);
		});
	</script>
</body>
</html>
